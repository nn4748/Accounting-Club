<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="لوحة متابعة تأكيد الحضور لفريق الموارد البشرية — نادي المحاسبة">
  <meta name="theme-color" content="#000878">
  <title>لوحة الموارد البشرية | نادي المحاسبة</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #000878; --ink-2: #1b2496; --muted: #6b6f99; --line: #e4e7f3; --bg: #f4f6fb;
      --ok: #157a43; --ok-bg: #e4f5eb; --bad: #b42318; --bad-bg: #fdecea; --wait: #a15c00; --wait-bg: #fff4de;
      --gray-bg: #eef0f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Almarai", sans-serif; background: var(--bg); color: #1a1d3a; min-height: 100vh; font-size: 14px; }
    button, input, select, textarea { font-family: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    .topbar { background: var(--ink); color: #fff; }
    .topbar .in { max-width: 1240px; margin: 0 auto; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .topbar img { width: 112px; height: auto; display: block; }
    .topbar h1 { font-size: 17px; font-weight: 800; }
    .topbar p { font-size: 12.5px; opacity: .75; margin-top: 3px; }
    .logout { background: transparent; border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: 10px; padding: 7px 12px; font-size: 12.5px; }

    .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 40px; }

    .login { max-width: 380px; margin: 70px auto; background: #fff; border-radius: 18px; padding: 28px; border: 1px solid var(--line); }
    .login h2 { color: var(--ink); font-size: 18px; margin-bottom: 6px; text-align: center; }
    .login p { color: var(--muted); font-size: 13px; text-align: center; margin-bottom: 16px; }
    .field { width: 100%; padding: 11px 13px; border: 1px solid #d6daec; border-radius: 10px; font-size: 14.5px; background: #fff; }
    .field:focus { outline: 2px solid rgba(0, 8, 120, .18); border-color: var(--ink); }
    .btn { padding: 10px 14px; border-radius: 10px; border: 1px solid transparent; font-weight: 700; font-size: 13.5px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
    .btn-primary { background: var(--ink); color: #fff; }
    .btn-primary:hover { background: var(--ink-2); }
    .btn-ghost { background: #fff; color: var(--ink); border-color: var(--line); }
    .btn-ghost:hover { border-color: #c8cde6; }
    .btn-block { width: 100%; margin-top: 12px; }
    .err { color: var(--bad); font-size: 13px; margin-top: 10px; text-align: center; }

    .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 14px; }
    .kpi { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; text-align: right; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
    .kpi:hover { border-color: #c8cde6; }
    .kpi.active { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink) inset; }
    .kpi .label { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .kpi .label i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .kpi b { display: block; font-size: 26px; color: var(--ink); margin-top: 6px; font-weight: 800; }
    .kpi small { font-size: 12px; color: var(--muted); }

    .progress { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; margin-bottom: 14px; }
    .progress .row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-bottom: 8px; }
    .progress .row b { color: var(--ink); }
    .bar { height: 10px; border-radius: 6px; background: var(--gray-bg); overflow: hidden; display: flex; }
    .bar span { display: block; height: 100%; }

    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
    .toolbar .field { flex: 1; min-width: 220px; }

    .table { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .thead, .tr { display: grid; grid-template-columns: 64px minmax(170px, 1.4fr) minmax(200px, 1.4fr) 150px minmax(210px, 1fr); gap: 12px; align-items: center; padding: 10px 14px; }
    .thead { background: #f8f9fd; color: var(--muted); font-size: 12px; font-weight: 700; border-bottom: 1px solid var(--line); }
    .tr { border-bottom: 1px solid var(--line); }
    .tr:last-child { border-bottom: 0; }
    .thumb { width: 56px; height: 56px; border-radius: 10px; background: var(--gray-bg); overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 11px; text-align: center; border: 0; padding: 0; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .who .name { font-weight: 800; color: var(--ink); font-size: 14px; }
    .who .sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .contact { font-size: 12.5px; direction: ltr; text-align: right; word-break: break-all; line-height: 1.7; }
    .issues { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .issue { font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--bad-bg); color: var(--bad); direction: rtl; }
    .issue.warn { background: var(--wait-bg); color: var(--wait); }
    .badge { display: inline-block; font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 20px; }
    .s-approved { background: var(--ok-bg); color: var(--ok); }
    .s-pending { background: var(--wait-bg); color: var(--wait); }
    .s-rejected { background: var(--bad-bg); color: var(--bad); }
    .s-no_photo, .s-unconfirmed { background: var(--gray-bg); color: #4b4f73; }
    .status .note { font-size: 11.5px; color: var(--bad); margin-top: 5px; }
    .status .time { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
    .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-start; }
    .acts .btn { padding: 7px 10px; font-size: 12.5px; }
    .a-ok { background: var(--ok); color: #fff; }
    .a-bad { background: #fff; color: var(--bad); border-color: #f0c2bd; }
    .a-soft { background: #fff; color: #4b4f73; border-color: var(--line); }
    .a-wa { background: #fff; color: #128c4b; border-color: #bfe5cf; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
    .loading { text-align: center; color: var(--muted); padding: 40px 0; }

    .overlay { position: fixed; inset: 0; background: rgba(10, 15, 60, .45); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
    .dialog { background: #fff; border-radius: 16px; padding: 20px; width: 100%; max-width: 520px; max-height: 92vh; overflow: auto; }
    .dialog h3 { color: var(--ink); font-size: 16px; margin-bottom: 6px; }
    .dialog .hint { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; line-height: 1.7; }
    .dialog label { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 6px; }
    .dialog textarea { width: 100%; min-height: 150px; padding: 10px 12px; border: 1px solid #d6daec; border-radius: 10px; font-size: 13.5px; line-height: 1.8; resize: vertical; }
    .dialog .btns { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .dialog .btns .btn { flex: 1; }
    .seg { display: flex; gap: 6px; flex-wrap: wrap; }
    .seg button { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 13px; color: #4b4f73; }
    .seg button.sel { border-color: var(--ink); color: var(--ink); font-weight: 800; background: #f1f3ff; }
    .reasons { display: flex; flex-direction: column; gap: 8px; }
    .reasons button { text-align: right; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 13.5px; }
    .reasons button.sel { border-color: var(--bad); background: var(--bad-bg); }
    .lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, .86); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
    .lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1d3a; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 60; }

    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 10px 16px 24px; line-height: 1.8; }

    @media (max-width: 960px) {
      .kpis { grid-template-columns: repeat(3, 1fr); }
      .thead { display: none; }
      .tr { grid-template-columns: 64px 1fr; grid-template-areas: "ph who" "ph contact" "st st" "ac ac"; gap: 8px 12px; padding: 14px; }
      .tr .thumb { grid-area: ph; align-self: start; }
      .tr .who { grid-area: who; }
      .tr .contact { grid-area: contact; }
      .tr .status { grid-area: st; }
      .tr .acts { grid-area: ac; }
    }
    @media (max-width: 560px) {
      .kpis { grid-template-columns: repeat(2, 1fr); }
      .topbar img { width: 86px; }
      .topbar h1 { font-size: 15px; }
      .toolbar .btn { flex: 1; }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="in">
      <div>
        <h1>لوحة الموارد البشرية</h1>
        <p>فعالية «ما وراء الأرقام» — متابعة التأكيد والتسجيل في منشآت</p>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <button class="logout" id="logoutBtn" type="button" hidden>خروج</button>
        <img src="/assets/club-white.webp" alt="نادي المحاسبة" width="714" height="252">
      </div>
    </div>
  </div>

  <div class="wrap">
    <section class="login" id="loginBox">
      <h2>تسجيل الدخول</h2>
      <p>هذه الصفحة خاصة بفريق الموارد البشرية.</p>
      <form id="loginForm">
        <input class="field" type="password" id="pw" placeholder="كلمة المرور" autocomplete="current-password">
        <button class="btn btn-primary btn-block" type="submit">دخول</button>
        <p class="err" id="loginErr" hidden></p>
      </form>
    </section>

    <section id="app" hidden>
      <div class="kpis" id="kpis"></div>
      <div class="progress" id="progress"></div>
      <div class="toolbar">
        <input class="field" type="search" id="search" placeholder="ابحث بالاسم أو البريد أو الجوال">
        <button class="btn btn-primary" id="remindBtn" type="button">✉️ إرسال تذكير</button>
        <button class="btn btn-ghost" id="exportBtn" type="button">⬇ تصدير Excel</button>
        <button class="btn btn-ghost" id="refreshBtn" type="button">⟳ تحديث</button>
      </div>
      <div class="table">
        <div class="thead"><span>الصورة</span><span>الاسم</span><span>التواصل</span><span>الحالة</span><span>الإجراءات</span></div>
        <div id="rows"><p class="loading">جاري التحميل…</p></div>
      </div>
    </section>
  </div>

  <footer>
    Made by Nourah N Aleissa<br>
    © <span id="year">2026</span> نادي المحاسبة — جامعة الإمام محمد بن سعود الإسلامية
  </footer>

  <script src="/js/register-checks.js"></script>
  <script>
    (function () {
      const API = "/.netlify/functions/confirm";
      const CONFIRM_URL = "https://accclubimamu.com/confirm";
      const CLUB_EMAIL = "accclub.imamu@gmail.com";
      const BATCH = 20;
      const EVENT_LINE = "فعالية «ما وراء الأرقام» يوم الأحد ١٥ نوفمبر من ٥ إلى ٧ مساءً في مركز دعم منشآت - الرياض";
      const $ = (id) => document.getElementById(id);
      $("year").textContent = new Date().getFullYear();

      const STATUS = {
        approved: { label: "مؤكد ✓", cls: "s-approved" },
        pending: { label: "بانتظار مراجعة الصورة", cls: "s-pending" },
        rejected: { label: "صورة مرفوضة", cls: "s-rejected" },
        no_photo: { label: "أكّد بدون صورة", cls: "s-no_photo" },
        unconfirmed: { label: "لم يؤكد", cls: "s-unconfirmed" },
      };
      const REASONS = [
        "الصورة ما تخص منشآت",
        "ما يبان اسم الفعالية (ما وراء الأرقام)",
        "الصورة لفعالية ثانية",
        "الصورة غير واضحة",
      ];
      const FILTERS = [
        ["all", "إجمالي المسجلين", "#000878"],
        ["approved", "المؤكدين", "#157a43"],
        ["pending", "بانتظار المراجعة", "#d48a00"],
        ["not_confirmed", "غير المؤكدين", "#9aa0c2"],
        ["issues", "فيهم ملاحظات", "#b42318"],
      ];

      let password = "";
      let people = [];
      let filter = "all";
      let emailEnabled = false;
      let reminders = {};
      try { password = sessionStorage.getItem("hrPw") || sessionStorage.getItem("reviewPw") || ""; } catch (e) { /* */ }

      async function call(payload) {
        const res = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...payload, password }) });
        let data = {};
        try { data = await res.json(); } catch (e) { /* */ }
        return { ok: res.ok, status: res.status, data };
      }

      function showLogin(msg) {
        password = "";
        try { sessionStorage.removeItem("hrPw"); } catch (e) { /* */ }
        $("app").hidden = true; $("logoutBtn").hidden = true; $("loginBox").hidden = false;
        $("loginErr").textContent = msg || ""; $("loginErr").hidden = !msg;
      }

      async function load() {
        $("refreshBtn").disabled = true;
        const { ok, status, data } = await call({ action: "hr-list" });
        $("refreshBtn").disabled = false;
        if (!ok) {
          if (status === 401) return showLogin("كلمة المرور غير صحيحة.");
          toast("تعذّر تحميل البيانات، حاول مرة ثانية.");
          return;
        }
        emailEnabled = !!data.emailEnabled;
        reminders = data.reminders || {};
        people = build(data.registrants || [], data.items || []);
        $("loginBox").hidden = true; $("app").hidden = false; $("logoutBtn").hidden = false;
        render();
      }

      /* ---------- دمج المسجلين مع التأكيدات + كشف المشاكل ---------- */
      const norm = (s) => String(s || "").trim().toLowerCase();
      const keyOf = (e) => norm(e).replace(/[^a-z0-9@._+-]/g, "_");

      function build(regs, confirmations) {
        const byEmail = new Map(confirmations.map((c) => [norm(c.email), c]));
        const emailCount = new Map();
        const phoneCount = new Map();
        regs.forEach((r) => {
          const e = norm(r.email); emailCount.set(e, (emailCount.get(e) || 0) + 1);
          const p = RegisterChecks.normalizePhone(r.phone).value; if (p) phoneCount.set(p, (phoneCount.get(p) || 0) + 1);
        });
        // آخر تسجيل لكل إيميل هو المعتمد.
        const seen = new Set();
        const list = [];
        for (let i = regs.length - 1; i >= 0; i--) {
          const r = regs[i];
          const key = norm(r.email);
          if (seen.has(key)) continue;
          seen.add(key);
          const c = byEmail.get(key);
          byEmail.delete(key);
          list.push(person(r, c, emailCount.get(key) || 1, phoneCount));
        }
        // مؤكدين ما لقيناهم بالشيت (انحذف تسجيلهم أو تغيّر الإيميل).
        byEmail.forEach((c) => {
          const p = person({ name: c.name, email: c.email, phone: c.phone, major: "" }, c, 1, phoneCount);
          p.issues.unshift({ t: "غير موجود بشيت التسجيل", lvl: "bad" });
          list.push(p);
        });
        return list.reverse();
      }

      function person(r, c, dupCount, phoneCount) {
        const status = !c ? "unconfirmed" : c.review;
        const issues = [];
        // الاسم
        const name = String(r.name || "").replace(/\s+/g, " ").trim();
        if (!name) issues.push({ t: "الاسم فاضي", lvl: "bad" });
        else {
          if (/[0-9٠-٩@#$%^&*_=+<>{}\[\]|\\/]/.test(name)) issues.push({ t: "الاسم فيه أرقام أو رموز", lvl: "bad" });
          if (name.split(" ").length < 3) issues.push({ t: "الاسم مو ثلاثي", lvl: "warn" });
          if (/[A-Za-z]/.test(name) && /[؀-ۿ]/.test(name)) issues.push({ t: "الاسم خليط عربي وإنجليزي", lvl: "warn" });
        }
        // الإيميل
        if (!RegisterChecks.isValidEmail(r.email)) issues.push({ t: "الإيميل غير صحيح", lvl: "bad" });
        else {
          const s = RegisterChecks.suggestEmail(r.email);
          if (s) issues.push({ t: "يمكن الإيميل غلط؛ المقصود " + s, lvl: "bad" });
        }
        if (dupCount > 1) issues.push({ t: `مسجّل ${dupCount} مرات بنفس الإيميل`, lvl: "warn" });
        // الجوال
        const ph = RegisterChecks.normalizePhone(r.phone);
        if (!String(r.phone || "").trim()) issues.push({ t: "رقم الجوال فاضي", lvl: "bad" });
        else if (!ph.ok) issues.push({ t: "رقم الجوال غير صحيح", lvl: "bad" });
        else if ((phoneCount.get(ph.value) || 0) > 1 && dupCount === 1) issues.push({ t: "نفس الجوال مسجل بإيميل ثاني", lvl: "warn" });
        // الصورة
        if (status === "rejected") issues.push({ t: "صورة التأكيد مرفوضة", lvl: "bad" });
        if (status === "no_photo") issues.push({ t: "أكّد بدون ما يرفع صورة", lvl: "warn" });
        return {
          name, email: String(r.email || "").trim(), phone: ph.ok ? ph.value : String(r.phone || "").trim(), phoneOk: ph.ok,
          major: String(r.major || "").trim(), status, image: c && c.image, note: (c && c.note) || "",
          confirmedAt: c && c.confirmedAt, proofAt: c && c.proofAt, reviewedAt: c && c.reviewedAt, issues,
        };
      }

      function matches(p, f) {
        if (f === "all") return true;
        if (f === "not_confirmed") return ["unconfirmed", "no_photo", "rejected"].includes(p.status);
        if (f === "issues") return p.issues.length > 0;
        return p.status === f;
      }

      /* ---------- العرض ---------- */
      function render() {
        const total = people.length;
        const count = (f) => people.filter((p) => matches(p, f)).length;
        $("kpis").replaceChildren(...FILTERS.map(([k, label, color]) => {
          const n = count(k);
          const el = document.createElement("button");
          el.type = "button";
          el.className = "kpi" + (filter === k ? " active" : "");
          const pct = k !== "all" && total ? `<small>${Math.round((n / total) * 100)}٪ من المسجلين</small>` : "<small>&nbsp;</small>";
          el.innerHTML = `<span class="label"><i style="background:${color}"></i>${label}</span><b>${n}</b>${pct}`;
          el.onclick = () => { filter = k; render(); };
          return el;
        }));

        const a = count("approved"), w = count("pending"), n = count("not_confirmed");
        const seg = (v, c) => (total ? `<span style="width:${(v / total) * 100}%;background:${c}"></span>` : "");
        $("progress").innerHTML = `<div class="row"><span>نسبة التأكيد</span><span><b>${a}</b> مؤكد · <b>${w}</b> بانتظار المراجعة · <b>${n}</b> غير مؤكد</span></div>`
          + `<div class="bar">${seg(a, "#157a43")}${seg(w, "#d48a00")}</div>`;

        const q = $("search").value.trim().toLowerCase();
        const list = visible(q);
        if (!list.length) { $("rows").innerHTML = '<p class="empty">ما فيه نتائج.</p>'; return; }
        $("rows").replaceChildren(...list.map(row));
      }

      function visible(q) {
        if (q === undefined) q = $("search").value.trim().toLowerCase();
        return people.filter((p) => matches(p, filter)
          && (!q || [p.name, p.email, p.phone].join(" ").toLowerCase().includes(q)));
      }

      function fmt(t) {
        return t ? new Date(t).toLocaleString("ar-SA-u-ca-gregory-nu-latn", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "";
      }

      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
      }

      function btn(text, cls, fn) {
        const b = el("button", "btn " + cls, text);
        b.type = "button"; b.onclick = fn;
        return b;
      }

      function row(p) {
        const tr = el("div", "tr");
        const th = el("button", "thumb");
        th.type = "button";
        if (p.image) {
          const img = el("img"); img.loading = "lazy"; img.src = p.image; img.alt = "صورة تسجيل " + p.name;
          th.appendChild(img); th.onclick = () => lightbox(p.image);
        } else { th.textContent = "بدون صورة"; th.disabled = true; th.style.cursor = "default"; }

        const who = el("div", "who");
        who.append(el("div", "name", p.name || "—"));
        if (p.major) who.append(el("div", "sub", p.major));
        if (p.issues.length) {
          const box = el("div", "issues");
          p.issues.forEach((i) => box.append(el("span", "issue" + (i.lvl === "warn" ? " warn" : ""), i.t)));
          who.append(box);
        }

        const contact = el("div", "contact");
        contact.append(el("div", "", p.email || "—"), el("div", "", p.phone || "—"));

        const st = el("div", "status");
        st.append(el("span", "badge " + STATUS[p.status].cls, STATUS[p.status].label));
        if (p.status === "rejected" && p.note) st.append(el("div", "note", "السبب: " + p.note));
        const t = p.proofAt ? "رفع الصورة " + fmt(p.proofAt) : p.confirmedAt ? "أكّد " + fmt(p.confirmedAt) : "";
        if (t) st.append(el("div", "time", t));
        const rem = reminders[keyOf(p.email)];
        if (rem && rem.at) st.append(el("div", "time", "✉️ آخر تذكير " + fmt(rem.at)));

        const acts = el("div", "acts");
        if (p.image) {
          if (p.status !== "approved") acts.append(btn("قبول", "a-ok", () => decide(p, "approved")));
          if (p.status !== "rejected") acts.append(btn("رفض", "a-bad", () => askReject(p)));
          if (p.status !== "pending") acts.append(btn("تراجع", "a-soft", () => decide(p, "pending")));
        }
        if (p.status !== "approved") {
          if (p.phoneOk) acts.append(btn("واتساب", "a-wa", () => whatsapp(p)));
          if (p.email) acts.append(btn("إيميل", "a-soft", () => remind([p])));
        }
        tr.append(th, who, contact, st, acts);
        return tr;
      }

      /* ---------- قرارات المراجعة ---------- */
      async function decide(p, decision, note) {
        const prev = { status: p.status, note: p.note };
        p.status = decision; p.note = note || "";
        p.issues = p.issues.filter((i) => i.t !== "صورة التأكيد مرفوضة");
        if (decision === "rejected") p.issues.push({ t: "صورة التأكيد مرفوضة", lvl: "bad" });
        render();
        const { ok } = await call({ action: "review-set", email: p.email, decision, note: note || "" });
        if (!ok) { p.status = prev.status; p.note = prev.note; render(); toast("ما انحفظ القرار، حاول مرة ثانية."); }
        else toast(decision === "approved" ? "تم القبول" : decision === "rejected" ? "تم الرفض" : "رجعت للمراجعة");
      }

      function askReject(p) {
        let chosen = "";
        const ov = el("div", "overlay");
        const d = el("div", "dialog");
        d.append(el("h3", "", "سبب رفض صورة " + (p.name || "")));
        d.append(el("p", "hint", "السبب يظهر للشخص في صفحة التأكيد عشان يرفع صورة صحيحة."));
        const rs = el("div", "reasons");
        REASONS.forEach((r) => {
          const b = btn(r, "", () => { chosen = r; rs.querySelectorAll("button").forEach((x) => x.classList.toggle("sel", x === b)); });
          rs.append(b);
        });
        const other = el("input", "field"); other.placeholder = "أو اكتب سبب آخر"; other.style.marginTop = "10px";
        const bs = el("div", "btns");
        bs.append(
          btn("تأكيد الرفض", "btn-primary", () => {
            const note = other.value.trim() || chosen;
            if (!note) return toast("اختر سبب الرفض");
            decide(p, "rejected", note); ov.remove();
          }),
          btn("إلغاء", "btn-ghost", () => ov.remove())
        );
        d.append(rs, other, bs);
        ov.append(d);
        ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
        document.body.append(ov);
      }

      /* ---------- التذكير ---------- */
      function template(kind, p) {
        const hi = p && p.name ? `مرحبًا ${p.name.split(" ")[0]}،` : "مرحبًا،";
        if (kind === "rejected") {
          return `${hi}\n\nشكرًا لتسجيلك في ${EVENT_LINE}.\n\nراجعنا صورة تسجيلك في منشآت ولم تُقبل${p && p.note ? " (" + p.note + ")" : ""}. نرجو رفع صورة واضحة لرسالة التسجيل في منشآت تظهر فيها اسم الفعالية من الرابط التالي:\n${CONFIRM_URL}\n\nنادي المحاسبة — جامعة الإمام محمد بن سعود الإسلامية`;
        }
        if (kind === "approved") {
          return `${hi}\n\nتم تأكيد حضورك في ${EVENT_LINE}.\n\nنتشرف بحضورك 🌟\n\nنادي المحاسبة — جامعة الإمام محمد بن سعود الإسلامية`;
        }
        return `${hi}\n\nشكرًا لتسجيلك في ${EVENT_LINE}.\n\nنذكّرك بتأكيد حضورك وإرفاق صورة تسجيلك في منشآت، عشان يظهر لك رابط قروب الفعالية:\n${CONFIRM_URL}\n\nنادي المحاسبة — جامعة الإمام محمد بن سعود الإسلامية`;
      }
      const SUBJECT = { unconfirmed: "تذكير بتأكيد حضورك — ما وراء الأرقام", rejected: "صورة تسجيلك في منشآت — ما وراء الأرقام", approved: "تأكيد حضورك — ما وراء الأرقام" };
      const kindOf = (p) => (p.status === "rejected" ? "rejected" : p.status === "approved" ? "approved" : "unconfirmed");

      function whatsapp(p, kind) {
        let n = p.phone.replace(/^\+/, "");
        if (/^05\d{8}$/.test(n)) n = "966" + n.slice(1);
        window.open(`https://wa.me/${n}?text=${encodeURIComponent(template(kind || kindOf(p), p))}`, "_blank", "noopener");
      }

      // المجموعات الجاهزة للتذكير الجماعي.
      const GROUPS = [
        ["unconfirmed", "ما أكدوا", (p) => p.status === "unconfirmed" || p.status === "no_photo"],
        ["rejected", "صورهم مرفوضة", (p) => p.status === "rejected"],
        ["approved", "المؤكدين", (p) => p.status === "approved"],
      ];

      function remind(single) {
        let kind = single ? kindOf(single[0]) : "unconfirmed";
        const ov = el("div", "overlay");
        const d = el("div", "dialog");
        const title = el("h3", "", single ? "إرسال إيميل إلى " + (single[0].name || single[0].email) : "إرسال تذكير جماعي");
        const hint = el("p", "hint");
        const seg = el("div", "seg");
        const subj = el("input", "field");
        const body = el("textarea");
        let recipients = [];

        function refresh() {
          recipients = single || people.filter(GROUPS.find((g) => g[0] === kind)[2]).filter((p) => RegisterChecks.isValidEmail(p.email));
          hint.textContent = single
            ? single[0].email
            : emailEnabled
              ? `${recipients.length} شخص — الإرسال المباشر يوصل لكل واحد رسالة باسمه من إيميل النادي.`
              : `سيتم الإرسال إلى ${recipients.length} شخص (مخفيين عن بعض في نسخة BCC).`;
          subj.value = SUBJECT[kind];
          body.value = template(kind, single && single[0]);
          seg.querySelectorAll("button").forEach((b) => b.classList.toggle("sel", b.dataset.k === kind));
          if (typeof renderSend === "function") renderSend();
        }

        if (!single) {
          GROUPS.forEach(([k, label, fn]) => {
            const b = btn(`${label} (${people.filter(fn).length})`, "", () => { kind = k; refresh(); });
            b.dataset.k = k; seg.append(b);
          });
        }
        const lblS = el("label", "", "العنوان"); const lblB = el("label", "", "نص الرسالة");
        const bs = el("div", "btns");
        const emails = (list) => (list || recipients).map((p) => p.email).join(",");
        const gmail = (list) => {
          // "إلى" = إيميل النادي، والناس في BCC — رسالة بدون "إلى" تروح للسبام أكثر.
          const to = single ? `&to=${encodeURIComponent(emails(list))}` : `&to=${CLUB_EMAIL}&bcc=${encodeURIComponent(emails(list))}`;
          window.open(`https://mail.google.com/mail/?view=cm&fs=1${to}&su=${encodeURIComponent(subj.value)}&body=${encodeURIComponent(body.value)}`, "_blank", "noopener");
        };
        const personal = (p) => {
          const first = (p.name || "").split(" ")[0];
          return first ? body.value.replace(/^مرحبًا،/, `مرحبًا ${first}،`) : body.value;
        };
        async function sendDirect(list, button) {
          if (!list.length) return toast("ما فيه أحد بهالمجموعة");
          if (!confirm(`يرسل الإيميل الحين لـ ${list.length} شخص من إيميل النادي. متأكد؟`)) return;
          button.disabled = true;
          let sent = 0, failed = "";
          for (let i = 0; i < list.length; i += 100) {
            button.textContent = `جاري الإرسال… ${sent}/${list.length}`;
            const part = list.slice(i, i + 100);
            const { ok, data } = await call({ action: "send-email", messages: part.map((p) => ({ to: p.email, subject: subj.value, text: single ? body.value : personal(p), kind })) });
            if (!ok) { failed = data.detail || data.error || "خطأ"; break; }
            sent += data.sent || 0;
            part.forEach((p) => { reminders[keyOf(p.email)] = { at: Date.now(), kind }; });
          }
          button.disabled = false;
          button.textContent = failed ? "✉️ إرسال مباشر من الموقع" : `✓ انرسل لـ ${sent}`;
          toast(failed ? "ما انرسل: " + failed : `تم الإرسال لـ ${sent} شخص`);
          render();
        }
        if (emailEnabled) {
          const direct = btn("✉️ إرسال مباشر من الموقع", "btn-primary", () => sendDirect(recipients, direct));
          direct.style.width = "100%"; direct.style.marginTop = "12px";
          d.__direct = direct;
        }
        if (single) {
          bs.append(
            btn("فتح في Gmail", "btn-primary", () => gmail()),
            btn("تطبيق البريد", "btn-ghost", () => {
              location.href = `mailto:${encodeURIComponent(emails())}?subject=${encodeURIComponent(subj.value)}&body=${encodeURIComponent(body.value)}`;
            }),
            btn("نسخ الرسالة", "btn-ghost", () => copy(body.value, "تم نسخ الرسالة"))
          );
        } else {
          bs.append(
            btn("نسخ الإيميلات", "btn-ghost", () => copy(emails(), "تم نسخ " + recipients.length + " إيميل")),
            btn("نسخ الرسالة", "btn-ghost", () => copy(body.value, "تم نسخ الرسالة"))
          );
        }
        // دفعات صغيرة عشان ما يصنّفها Gmail سبام.
        const batchBox = el("div");
        const waBox = el("div");
        function renderSend() {
          if (single) return;
          batchBox.replaceChildren();
          waBox.replaceChildren();
          if (!recipients.length) return;
          batchBox.append(el("label", "", `إيميل على دفعات (${BATCH} شخص بكل رسالة) — اضغط كل دفعة وأرسلها من Gmail:`));
          const row = el("div", "seg");
          for (let i = 0; i < recipients.length; i += BATCH) {
            const part = recipients.slice(i, i + BATCH);
            const b = btn(`دفعة ${i / BATCH + 1} (${i + 1}–${i + part.length})`, "", () => { gmail(part); b.classList.add("sel"); b.textContent = "✓ " + b.textContent.replace(/^✓ /, ""); });
            row.append(b);
          }
          batchBox.append(row);

          const phones = recipients.filter((p) => p.phoneOk);
          if (!phones.length) return;
          let i = 0;
          waBox.append(el("label", "", "واتساب واحد واحد (يوصل أكيد ومو سبام):"));
          const next = btn("", "a-wa", () => {
            if (i >= phones.length) return;
            whatsapp(phones[i], kind);
            i++; update();
          });
          next.style.width = "100%";
          function update() {
            next.textContent = i < phones.length ? `📱 أرسل لـ ${phones[i].name || phones[i].phone} (${i + 1} من ${phones.length})` : "✓ خلصت كل الأرقام";
            next.disabled = i >= phones.length;
          }
          update();
          waBox.append(next);
        }
        const close = btn("إغلاق", "btn-ghost", () => ov.remove());
        close.style.width = "100%"; close.style.marginTop = "8px";
        d.append(title, hint);
        if (!single) d.append(seg);
        d.append(lblS, subj, lblB, body);
        if (d.__direct) d.append(d.__direct);
        d.append(batchBox, waBox, bs, close);
        ov.append(d);
        ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
        document.body.append(ov);
        refresh();
      }

      async function copy(text, msg) {
        try { await navigator.clipboard.writeText(text); toast(msg); }
        catch (e) {
          const t = el("textarea"); t.value = text; document.body.append(t); t.select();
          try { document.execCommand("copy"); toast(msg); } catch (er) { toast("ما قدرنا ننسخ"); }
          t.remove();
        }
      }

      /* ---------- التصدير ---------- */
      function exportCSV() {
        const esc = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
        const lines = [["الاسم", "البريد", "الجوال", "التخصص", "الحالة", "سبب الرفض", "ملاحظات", "وقت التأكيد", "وقت رفع الصورة"].map(esc).join(",")];
        visible().forEach((p) => lines.push([p.name, p.email, p.phone, p.major, STATUS[p.status].label.replace(" ✓", ""), p.note,
          p.issues.map((i) => i.t).join(" | "), fmt(p.confirmedAt), fmt(p.proofAt)].map(esc).join(",")));
        const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
        const a = el("a"); a.href = URL.createObjectURL(blob);
        a.download = "ما-وراء-الأرقام-" + new Date().toISOString().slice(0, 10) + ".csv";
        document.body.append(a); a.click(); a.remove();
      }

      function lightbox(src) {
        const lb = el("div", "lightbox"); const img = el("img"); img.src = src; img.alt = "";
        lb.append(img); lb.onclick = () => lb.remove(); document.body.append(lb);
      }

      let toastTimer;
      function toast(msg) {
        document.querySelectorAll(".toast").forEach((t) => t.remove());
        const t = el("div", "toast", msg); document.body.append(t);
        clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 2400);
      }

      $("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        password = $("pw").value;
        $("loginErr").hidden = true;
        try { sessionStorage.setItem("hrPw", password); } catch (err) { /* */ }
        load();
      });
      $("logoutBtn").addEventListener("click", () => showLogin(""));
      $("search").addEventListener("input", render);
      $("refreshBtn").addEventListener("click", load);
      $("remindBtn").addEventListener("click", () => remind(null));
      $("exportBtn").addEventListener("click", exportCSV);
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.querySelectorAll(".overlay,.lightbox").forEach((x) => x.remove()); });
      if (password) load();
    })();
  </script>
</body>
</html>
