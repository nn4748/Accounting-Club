[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# اختبار "مجالك المحاسبي" مخفي: روابطه تحوّل للرئيسية (quiz.html باقي بالكود).
[[redirects]]
  from = "/quiz"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/quiz/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/quiz.html"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/live-display"
  to = "/live-display.html"
  status = 200

[[redirects]]
  from = "/live-display/*"
  to = "/live-display.html"
  status = 200

[[redirects]]
  from = "/phone"
  to = "/phone.html"
  status = 200

[[redirects]]
  from = "/phone-live"
  to = "/phone-live.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/confirm"
  to = "/confirm.html"
  status = 200

[[redirects]]
  from = "/hr"
  to = "/hr.html"
  status = 200

[[redirects]]
  from = "/review"
  to = "/hr"
  status = 301

[[headers]]
  for = "/hr*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/review*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/phone-live*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/confirm*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/live-display*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
