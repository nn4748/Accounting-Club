[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/quiz"
  to = "/quiz.html"
  status = 200

[[redirects]]
  from = "/quiz/*"
  to = "/quiz.html"
  status = 200

[[redirects]]
  from = "/live-display"
  to = "/live-display.html"
  status = 200

[[redirects]]
  from = "/live-display/*"
  to = "/live-display.html"
  status = 200

[[redirects]]
  from = "/confirm"
  to = "/confirm.html"
  status = 200

[[redirects]]
  from = "/hr"
  to = "/hr.html"
  status = 200

[[redirects]]
  from = "/review"
  to = "/hr"
  status = 301

[[headers]]
  for = "/hr*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/review*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/confirm*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/live-display*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
