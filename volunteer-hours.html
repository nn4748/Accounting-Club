  <link

    rel="stylesheet"

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scrollbar-color: #6ccff6 rgba(255, 255, 255, 0.1);
      scrollbar-width: thin;
    }

    ::selection {
      background: #6ccff6;
      color: #000878;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
    }

    ::-webkit-scrollbar-thumb {
      background: #6ccff6;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #4db8e8;
    }

    body {
      min-height: 100vh;
      font-family: "Almarai", sans-serif;
      background: #0a0e6e;
      padding: 10px 15px 40px;
    }

    .top-bar {
      width: 100%;
      max-width: 640px;
      margin: 0 auto 5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .back-button {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.22);
      color: white;
      text-decoration: none;
      font-size: 25px;
      font-weight: 400;
      transition: background 0.25s ease, transform 0.25s ease;
    }

    .back-button:hover {
      background: rgba(255,255,255,0.22);
      transform: translateX(3px);
    }

    .club-logo {
      width: 200px;
      height: 200px;
      object-fit: contain;
      transform: translateY(-10px);
    }

    .wrap {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    .intro {
      text-align: center;
      color: #fff;
      margin-bottom: 22px;
    }

    .intro h1 {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .intro p {
      font-size: 14px;
      opacity: .8;
      line-height: 1.7;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 26px 24px;
      box-shadow: 0 2px 16px rgba(13, 26, 94, 0.25);
    }

    .card input, .card textarea {
      width: 100%;
      padding: 13px 14px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid #d8dcef;
      box-sizing: border-box;
      font-family: "Almarai", sans-serif;
      font-size: 14.5px;
      background: #f8f9fd;
    }

    .card textarea {
      resize: vertical;
      min-height: 90px;
    }

    .card input:focus, .card textarea:focus {
      outline: none;
      border-color: #000878;
      background: #fff;
    }

    .card button {
      width: 100%;
      padding: 14px;
      background: #000878;
      color: white;
      border: none;
      border-radius: 10px;
      font-family: "Almarai", sans-serif;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.25s ease;
    }

    .card button:hover { background: #0a1470; }
    .card button:disabled { opacity: .6; cursor: default; }

    #idError {
      color: #d43b3b;
      font-size: 13.5px;
      font-weight: 700;
      margin: -6px 0 14px;
      display: none;
    }

    #memberFound {
      display: none;
      background: #eef3ff;
      border: 1px solid #cfd9f5;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
      font-size: 14.5px;
      font-weight: 700;
      color: #000878;
    }

    .success-message, .error-message {
      text-align: center;
      padding: 30px 10px;
      display: none;
    }

    .success-message .icon, .error-message .icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .success-message p, .error-message p {
      color: #000878;
      font-weight: 700;
      font-size: 16px;
      line-height: 1.7;
    }

    @media (max-width: 500px) {
      .card { padding: 22px 18px; }
      .club-logo { width: 84px; height: 84px; transform: translateY(-4px); }
    }

  </style>

<body>

  <div class="top-bar">
    <img class="club-logo" src="assets/club.webp" alt="شعار نادي المحاسبة">
    <a href="index.html" class="back-button" aria-label="العودة">←</a>
  </div>

  <div class="wrap">

    <div class="intro">
      <h1>الاستعلام عن الساعات التطوعية</h1>
      <p>اكتب رقمك الجامعي للاستعلام عن عدد ساعاتك التطوعية.</p>
    </div>

    <div class="card" id="mainCard">

      <div id="idStep">
        <input type="text" id="universityIdInput" placeholder="الرقم الجامعي" inputmode="numeric">
        <div id="idError">ما لقينا هذا الرقم الجامعي، تأكد من كتابته صح.</div>
        <button type="button" id="checkIdBtn">استعلام</button>
      </div>

      <div id="memberFound"></div>

    </div>

  </div>

  <script>

    const HOURS_CSV_URL = "https://docs.google.com/spreadsheets/d/1rsmJRtDDdZHWwssFYTG6wmKiOSdVw0irFXE8i3gjC90/export?format=csv";

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let value = "";
      let insideQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];
        if (char === '"' && insideQuotes && next === '"') { value += '"'; i++; }
        else if (char === '"') { insideQuotes = !insideQuotes; }
        else if (char === ',' && !insideQuotes) { row.push(value); value = ""; }
        else if ((char === '\n' || char === '\r') && !insideQuotes) {
          if (char === '\r' && next === '\n') i++;
          row.push(value); rows.push(row); row = []; value = "";
        } else { value += char; }
      }
      if (value !== "" || row.length) { row.push(value); rows.push(row); }
      return rows;
    }

    function formatHours(raw) {
      const parts = (raw || "0:00:00").split(":").map(Number);
      const h = parts[0] || 0;
      const m = parts[1] || 0;
      if (h === 0 && m === 0) return "0 ساعة";
      if (h === 0) return m + " دقيقة";
      if (m === 0) return h + " ساعة";
      return h + " ساعة و" + m + " دقيقة";
    }

    async function loadMembers() {
      const res = await fetch(HOURS_CSV_URL + "&t=" + Date.now());
      const text = await res.text();
      const rows = parseCSV(text);
      const members = {};
      rows.forEach(r => {
        const universityId = (r[4] || "").trim();
        const nameAr = (r[1] || "").trim();
        if (!universityId || !nameAr) return;
        members[universityId] = { name: nameAr, hours: formatHours((r[8] || "").trim()) };
      });
      return members;
    }

    const idStep = document.getElementById("idStep");
    const universityIdInput = document.getElementById("universityIdInput");
    const idError = document.getElementById("idError");
    const checkIdBtn = document.getElementById("checkIdBtn");
    const memberFound = document.getElementById("memberFound");

    let membersPromise = loadMembers().catch(err => {
      console.error("تعذر تحميل بيانات الساعات التطوعية:", err);
      return {};
    });

    function normalizeId(raw) {
      return (raw || "").replace(/[^\d]/g, "");
    }

    async function checkId() {
      checkIdBtn.disabled = true;
      checkIdBtn.textContent = "جارِ البحث...";
      const members = await membersPromise;
      checkIdBtn.disabled = false;
      checkIdBtn.textContent = "استعلام";

      const id = normalizeId(universityIdInput.value);
      const rec = members[id];
      if (!rec) {
        idError.style.display = "block";
        memberFound.style.display = "none";
        return;
      }
      idError.style.display = "none";
      memberFound.style.display = "block";
      memberFound.innerHTML = "هلا " + rec.name + "<br>عدد ساعاتك التطوعية: " + rec.hours;
    }

    checkIdBtn.addEventListener("click", checkId);
    universityIdInput.addEventListener("keydown", (e) => { if (e.key === "Enter") checkId(); });

  </script>

</body>
</html>
