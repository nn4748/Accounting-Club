<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000878">
<title>الصفحة غير موجودة | نادي المحاسبة</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles-2026-09-11.css">
<style>
  .error-page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 24px;
    gap:18px;
  }
  .error-page .mark{
    width:120px;height:120px;margin-bottom:10px;
    background:var(--ink);
    -webkit-mask-image:url(assets/club-mark-white.webp);
    mask-image:url(assets/club-mark-white.webp);
    -webkit-mask-size:contain;mask-size:contain;
    -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:center;mask-position:center;
  }
  .error-page .code{
    font-size:clamp(56px,10vw,96px);
    font-weight:800;
    color:var(--ink);
    line-height:1;
  }
  .error-page h1{
    font-size:clamp(20px,3vw,28px);
    color:var(--ink);
  }
  .error-page p{
    color:#3a3a44;
    max-width:46ch;
    font-size:16px;
  }
</style>
</head>

<body>
  <div class="error-page">
    <div class="mark" role="img" aria-label="شعار نادي المحاسبة"></div>
    <div class="code">404</div>
    <h1>الصفحة عليها ضغط</h1>
    <p>ثوانٍ وترجع، أو بإمكانك الرجوع للصفحة الرئيسية.</p>
    <a href="index.html" class="btn">الصفحة الرئيسية</a>
  </div>
</body>

</html>
