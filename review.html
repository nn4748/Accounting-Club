<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000878">
  <title>مراجعة صور التسجيل | نادي المحاسبة</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #000878; --muted: #6b6f99; --line: #e3e7f6; --ok: #1a8f4c; --bad: #c62828; --wait: #b26a00; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Almarai", sans-serif; background: #f3f5fc; color: #1a1d3a; min-height: 100vh; }
    header { background: var(--ink); color: #fff; padding: 18px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    header img { width: 120px; height: auto; }
    header h1 { font-size: 18px; font-weight: 800; }
    header p { font-size: 13px; opacity: .8; margin-top: 2px; }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 18px 16px 40px; }
    .login { max-width: 380px; margin: 60px auto; background: #fff; border-radius: 20px; padding: 26px; box-shadow: 0 6px 24px rgba(0, 8, 120, .08); }
    .login h2 { color: var(--ink); font-size: 18px; margin-bottom: 14px; text-align: center; }
    input, select { width: 100%; padding: 12px 14px; border: 1px solid #d8dcef; border-radius: 12px; font-family: inherit; font-size: 15px; background: #f8f9fd; }
    button { font-family: inherit; cursor: pointer; }
    .btn { padding: 11px 16px; border-radius: 12px; border: 0; font-weight: 800; font-size: 14px; }
    .btn-primary { background: var(--ink); color: #fff; width: 100%; margin-top: 12px; }
    .err { color: var(--bad); font-size: 13px; margin-top: 10px; text-align: center; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
    .stat { background: #fff; border-radius: 14px; padding: 12px; text-align: center; border: 2px solid transparent; cursor: pointer; }
    .stat.active { border-color: var(--ink); }
    .stat b { display: block; font-size: 24px; color: var(--ink); }
    .stat span { font-size: 12.5px; color: var(--muted); }
    .toolbar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .toolbar input { flex: 1; min-width: 200px; }
    .toolbar .btn { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 10px rgba(0, 8, 120, .06); display: flex; flex-direction: column; }
    .card .photo { background: #eef1fa; height: 300px; display: flex; align-items: center; justify-content: center; cursor: zoom-in; }
    .card .photo img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .card .photo .none { color: var(--muted); font-size: 13px; }
    .card .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .card .name { font-weight: 800; color: var(--ink); font-size: 15px; }
    .card .meta { font-size: 12.5px; color: var(--muted); direction: ltr; text-align: right; word-break: break-all; }
    .badge { align-self: flex-start; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 20px; margin: 4px 0; }
    .b-pending { background: #fff3dc; color: var(--wait); }
    .b-approved { background: #e3f6ea; color: var(--ok); }
    .b-rejected { background: #fdeceb; color: var(--bad); }
    .b-no_photo { background: #eef0f6; color: var(--muted); }
    .note { font-size: 12.5px; color: var(--bad); }
    .actions { display: flex; gap: 8px; margin-top: auto; padding-top: 8px; }
    .actions .btn { flex: 1; padding: 9px 10px; font-size: 13.5px; }
    .a-ok { background: var(--ok); color: #fff; }
    .a-bad { background: #fff; color: var(--bad); border: 1px solid #f1b9b5 !important; }
    .a-undo { background: #fff; color: var(--muted); border: 1px solid var(--line) !important; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
    .lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, .85); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
    .lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; }
    .modal { position: fixed; inset: 0; background: rgba(10, 15, 60, .45); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
    .modal .box { background: #fff; border-radius: 18px; padding: 20px; width: 100%; max-width: 380px; }
    .modal h3 { color: var(--ink); font-size: 16px; margin-bottom: 10px; }
    .reasons { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .reasons button { text-align: right; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #f8f9fd; font-size: 13.5px; }
    .reasons button.sel { border-color: var(--bad); background: #fdeceb; }
    .modal .row { display: flex; gap: 8px; margin-top: 12px; }
    .modal .row .btn { flex: 1; }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 10px 16px 24px; line-height: 1.8; }
    @media (max-width: 640px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .card .photo { height: 260px; }
    }
  </style>
</head>

<body>
  <header>
    <div>
      <h1>مراجعة صور التسجيل — ما وراء الأرقام</h1>
      <p>تأكد إن الصورة رسالة/صفحة تأكيد من منشآت وفيها اسم الفعالية.</p>
    </div>
    <img src="/assets/club-white.webp" alt="نادي المحاسبة" width="714" height="252">
  </header>

  <div class="wrap">
    <section class="login" id="loginBox">
      <h2>دخول المراجعة</h2>
      <form id="loginForm">
        <input type="password" id="pw" placeholder="كلمة المرور" autocomplete="current-password">
        <button class="btn btn-primary" type="submit">دخول</button>
        <p class="err" id="loginErr" hidden></p>
      </form>
    </section>

    <section id="app" hidden>
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <input type="search" id="search" placeholder="ابحث بالاسم أو البريد أو الجوال">
        <button class="btn" id="refreshBtn" type="button">تحديث ⟳</button>
      </div>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>ما فيه نتائج.</p>
    </section>
  </div>

  <footer>
    Made by Nourah N Aleissa<br>
    © <span id="year">2026</span> نادي المحاسبة — جامعة الإمام محمد بن سعود الإسلامية
  </footer>

  <script>
    (function () {
      const API = "/.netlify/functions/confirm";
      const $ = (id) => document.getElementById(id);
      $("year").textContent = new Date().getFullYear();
      const LABEL = { pending: "بانتظار المراجعة", approved: "مقبول ✓", rejected: "مرفوض ✕", no_photo: "أكّد بدون صورة" };
      const REASONS = [
        "الصورة ما تخص منشآت",
        "ما يبان اسم الفعالية (ما وراء الأرقام)",
        "الصورة لفعالية ثانية",
        "الصورة غير واضحة",
      ];
      let password = "";
      let items = [];
      let filter = "pending";

      try { password = sessionStorage.getItem("reviewPw") || ""; } catch (e) { /* */ }

      async function call(payload) {
        const res = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ...payload, password }) });
        let data = {};
        try { data = await res.json(); } catch (e) { /* */ }
        return { ok: res.ok, status: res.status, data };
      }

      async function load() {
        const { ok, status, data } = await call({ action: "review-list" });
        if (!ok) {
          if (status === 401) {
            password = "";
            try { sessionStorage.removeItem("reviewPw"); } catch (e) { /* */ }
            $("app").hidden = true;
            $("loginBox").hidden = false;
            $("loginErr").textContent = "كلمة المرور غير صحيحة.";
            $("loginErr").hidden = false;
          }
          return;
        }
        items = data.items || [];
        $("loginBox").hidden = true;
        $("app").hidden = false;
        render();
      }

      function fmt(t) {
        if (!t) return "";
        return new Date(t).toLocaleString("ar-SA-u-ca-gregory-nu-latn", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
      }

      function render() {
        const counts = { pending: 0, approved: 0, rejected: 0, no_photo: 0 };
        items.forEach((i) => { counts[i.review] = (counts[i.review] || 0) + 1; });
        $("stats").innerHTML = "";
        [["pending", "بانتظار المراجعة"], ["approved", "مقبول"], ["rejected", "مرفوض"], ["no_photo", "أكّد بدون صورة"]].forEach(([k, l]) => {
          const s = document.createElement("div");
          s.className = "stat" + (filter === k ? " active" : "");
          s.innerHTML = `<b>${counts[k] || 0}</b><span>${l}</span>`;
          s.onclick = () => { filter = filter === k ? "all" : k; render(); };
          $("stats").appendChild(s);
        });

        const q = $("search").value.trim().toLowerCase();
        const list = items.filter((i) => (filter === "all" || i.review === filter)
          && (!q || [i.name, i.email, i.phone].join(" ").toLowerCase().includes(q)));
        $("grid").replaceChildren(...list.map(card));
        $("empty").hidden = list.length > 0;
      }

      function card(i) {
        const el = document.createElement("article");
        el.className = "card";
        const photo = document.createElement("div");
        photo.className = "photo";
        if (i.image) {
          const img = document.createElement("img");
          img.loading = "lazy";
          img.src = i.image;
          img.alt = "صورة تسجيل " + (i.name || "");
          photo.appendChild(img);
          photo.onclick = () => openLightbox(i.image);
        } else {
          photo.innerHTML = '<span class="none">ما رفع صورة</span>';
        }
        const body = document.createElement("div");
        body.className = "body";
        const name = document.createElement("div"); name.className = "name"; name.textContent = i.name || "—";
        const meta = document.createElement("div"); meta.className = "meta"; meta.textContent = [i.email, i.phone].filter(Boolean).join(" · ");
        const time = document.createElement("div"); time.className = "meta"; time.style.direction = "rtl";
        time.textContent = i.proofAt ? "رفع الصورة: " + fmt(i.proofAt) : "أكّد الحضور: " + fmt(i.confirmedAt);
        const badge = document.createElement("span"); badge.className = "badge b-" + i.review; badge.textContent = LABEL[i.review];
        body.append(name, meta, time, badge);
        if (i.review === "rejected" && i.note) {
          const n = document.createElement("div"); n.className = "note"; n.textContent = "السبب: " + i.note; body.appendChild(n);
        }
        if (i.image) {
          const actions = document.createElement("div"); actions.className = "actions";
          if (i.review !== "approved") actions.appendChild(button("قبول ✓", "a-ok", () => decide(i, "approved")));
          if (i.review !== "rejected") actions.appendChild(button("رفض ✕", "a-bad", () => askReject(i)));
          if (i.review !== "pending") actions.appendChild(button("تراجع", "a-undo", () => decide(i, "pending")));
          body.appendChild(actions);
        }
        el.append(photo, body);
        return el;
      }

      function button(text, cls, fn) {
        const b = document.createElement("button");
        b.type = "button"; b.className = "btn " + cls; b.textContent = text; b.onclick = fn;
        return b;
      }

      async function decide(i, decision, note) {
        const prev = { review: i.review, note: i.note };
        i.review = decision; i.note = note || "";
        render();
        const { ok } = await call({ action: "review-set", email: i.email, decision, note: note || "" });
        if (!ok) { i.review = prev.review; i.note = prev.note; render(); alert("ما انحفظ القرار، حاول مرة ثانية."); }
      }

      function askReject(i) {
        const modal = document.createElement("div");
        modal.className = "modal";
        let chosen = "";
        modal.innerHTML = `<div class="box"><h3>سبب رفض صورة ${i.name || ""}</h3><div class="reasons"></div><input type="text" placeholder="أو اكتب سبب ثاني (اختياري)"><div class="row"></div></div>`;
        const reasons = modal.querySelector(".reasons");
        REASONS.forEach((r) => {
          const b = document.createElement("button"); b.type = "button"; b.textContent = r;
          b.onclick = () => { chosen = r; reasons.querySelectorAll("button").forEach((x) => x.classList.toggle("sel", x === b)); };
          reasons.appendChild(b);
        });
        const input = modal.querySelector("input");
        const row = modal.querySelector(".row");
        row.append(
          button("رفض", "a-bad", () => { decide(i, "rejected", input.value.trim() || chosen); modal.remove(); }),
          button("إلغاء", "a-undo", () => modal.remove())
        );
        modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
        document.body.appendChild(modal);
      }

      function openLightbox(src) {
        const lb = document.createElement("div");
        lb.className = "lightbox";
        const img = document.createElement("img"); img.src = src;
        lb.appendChild(img);
        lb.onclick = () => lb.remove();
        document.body.appendChild(lb);
      }

      $("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        password = $("pw").value;
        $("loginErr").hidden = true;
        try { sessionStorage.setItem("reviewPw", password); } catch (err) { /* */ }
        load();
      });
      $("search").addEventListener("input", render);
      $("refreshBtn").addEventListener("click", load);
      if (password) load();
    })();
  </script>
</body>
</html>
