<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000878">
  <title>إرسال إشعار | نادي المحاسبة</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Almarai", sans-serif;
      background: #0a0e6e;
      padding: 30px 15px 50px;
      color: #fff;
    }

    .wrap { width: 100%; max-width: 480px; margin: 0 auto; }

    h1 { text-align: center; font-size: 22px; font-weight: 800; margin-bottom: 20px; }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 24px 22px;
      box-shadow: 0 2px 16px rgba(13, 26, 94, 0.25);
      color: #1a1a2e;
    }

    label {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      color: #000878;
      margin-bottom: 6px;
      margin-top: 14px;
    }
    label:first-of-type { margin-top: 0; }

    input, textarea {
      width: 100%;
      padding: 12px 13px;
      border-radius: 10px;
      border: 1px solid #d8dcef;
      font-family: "Almarai", sans-serif;
      font-size: 14.5px;
      background: #f8f9fd;
    }
    textarea { resize: vertical; min-height: 80px; }
    input:focus, textarea:focus { outline: none; border-color: #000878; background: #fff; }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: #000878;
      color: white;
      border: none;
      border-radius: 10px;
      font-family: "Almarai", sans-serif;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.25s ease;
    }
    button:hover { background: #0a1470; }
    button:disabled { opacity: .6; cursor: default; }

    .result {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      display: none;
      line-height: 1.7;
    }
    .result.ok { display: block; background: #eafaf0; color: #1a8f4c; }
    .result.err { display: block; background: #fdeceb; color: #d43b3b; }
    .stats-card { margin-top: 18px; }
    .stats-card h2 { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
    .stats-card p.hint { font-size: 13px; color: #6b6f99; margin-bottom: 10px; }
    .stats-totals { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px 0; }
    .stats-totals div { background: #f3f5ff; border-radius: 12px; padding: 10px; text-align: center; }
    .stats-totals b { display: block; font-size: 22px; color: #000878; }
    .stats-totals span { font-size: 12px; color: #6b6f99; }
    .stats-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .stats-table th, .stats-table td { padding: 7px 4px; border-bottom: 1px solid #eceefa; text-align: center; }
    .stats-table th { color: #6b6f99; font-weight: 700; }
    #statsBox { overflow-x: auto; }
  </style>
</head>

<body>

  <div class="wrap">
    <h1>إرسال إشعار لأعضاء النادي</h1>

    <div class="card">
      <label for="pwInput">كلمة المرور</label>
      <input type="password" id="pwInput" placeholder="كلمة مرور الأدمن">

      <label for="titleInput">العنوان</label>
      <input type="text" id="titleInput" value="نادي المحاسبة">

      <label for="bodyInput">النص</label>
      <textarea id="bodyInput">ما جربت لعبتنا الجديدة! جا دورك تدخل تجرّبها واختبر محاسبيتك🚀</textarea>

      <label for="urlInput">الرابط عند الضغط على الإشعار</label>
      <input type="text" id="urlInput" value="/index.html?game=1">

      <button type="button" id="sendBtn">إرسال للجميع</button>

      <div class="result" id="resultBox"></div>
    </div>

    <div class="card stats-card">
      <h2>إحصائيات الموقع</h2>
      <p class="hint">بنفس كلمة المرور فوق. تُحسب الزيارات من يوم تفعيل الإحصائيات، وبدون أي بيانات شخصية.</p>
      <button type="button" id="statsBtn">عرض إحصائيات آخر ٧ أيام</button>
      <div class="result" id="statsError"></div>
      <div id="statsBox"></div>
    </div>

    <div class="card stats-card">
      <h2>تأكيدات الحضور — ما وراء الأرقام</h2>
      <p class="hint">بنفس كلمة المرور فوق. يحمّل ملف Excel (CSV) فيه كل اللي أكدوا حضورهم ومين قال إنه سجّل عند منشآت.</p>
      <button type="button" id="confirmExportBtn">تحميل قائمة المؤكدين</button>
      <div class="result" id="confirmExportMsg"></div>
    </div>
  </div>

  <script>
    const sendBtn = document.getElementById("sendBtn");
    const resultBox = document.getElementById("resultBox");

    sendBtn.addEventListener("click", async () => {
      const password = document.getElementById("pwInput").value;
      const title = document.getElementById("titleInput").value.trim();
      const body = document.getElementById("bodyInput").value.trim();
      const url = document.getElementById("urlInput").value.trim();

      if (!password) {
        resultBox.className = "result err";
        resultBox.textContent = "اكتب كلمة المرور.";
        return;
      }
      if (!title || !body) {
        resultBox.className = "result err";
        resultBox.textContent = "العنوان والنص مطلوبان.";
        return;
      }

      sendBtn.disabled = true;
      sendBtn.textContent = "جارِ الإرسال...";
      resultBox.className = "result";
      resultBox.style.display = "none";

      try {
        const res = await fetch("/.netlify/functions/send-notification", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password, title, body, url }),
        });
        const data = await res.json();

        if (!res.ok) {
          resultBox.className = "result err";
          resultBox.textContent = data.error || "صار خطأ غير متوقع.";
        } else {
          resultBox.className = "result ok";
          resultBox.textContent =
            `تم الإرسال ✅ — وصل لـ ${data.sent} مشترك` +
            (data.removed ? `، وحُذف ${data.removed} اشتراك منتهي` : "") +
            (data.failed ? `، وفشل الإرسال لـ ${data.failed}` : "") +
            ".";
        }
      } catch (err) {
        resultBox.className = "result err";
        resultBox.textContent = "تعذر الاتصال بالخادم، تأكد من اتصالك بالإنترنت.";
      }

      sendBtn.disabled = false;
      sendBtn.textContent = "إرسال للجميع";
    });

    document.getElementById("confirmExportBtn").addEventListener("click", async () => {
      const password = document.getElementById("pwInput").value;
      const msg = document.getElementById("confirmExportMsg");
      if (!password) { msg.className = "result err"; msg.textContent = "اكتب كلمة المرور فوق."; return; }
      try {
        const res = await fetch("/.netlify/functions/confirm", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "export", password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "صار خطأ غير متوقع.");
        const url = URL.createObjectURL(new Blob([data.csv], { type: "text/csv;charset=utf-8" }));
        const a = document.createElement("a");
        a.href = url;
        a.download = "تأكيدات-الحضور-ما-وراء-الأرقام.csv";
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        msg.className = "result ok";
        msg.textContent = `تم التحميل ✅ — عدد المؤكدين: ${data.count}`;
      } catch (err) {
        msg.className = "result err";
        msg.textContent = err.message || "تعذر الاتصال بالخادم.";
      }
    });

    const STAT_COLS = [
      ["visitors", "زوار"],
      ["view:home", "الرئيسية"],
      ["view:quiz", "صفحة الاختبار"],
      ["quiz_done", "كمّلوا الاختبار"],
      ["card_share", "شاركوا البطاقة"],
      ["view:register", "صفحة التسجيل"],
      ["register_done", "سجّلوا"],
      ["view:events", "الفعاليات"],
      ["confirm_done", "أكدوا الحضور"],
    ];
    const statsBtn = document.getElementById("statsBtn");
    statsBtn.addEventListener("click", async () => {
      const password = document.getElementById("pwInput").value;
      const errBox = document.getElementById("statsError");
      const box = document.getElementById("statsBox");
      errBox.className = "result";
      if (!password) { errBox.className = "result err"; errBox.textContent = "اكتب كلمة المرور فوق."; return; }
      statsBtn.disabled = true;
      statsBtn.textContent = "جارِ التحميل...";
      try {
        const res = await fetch("/.netlify/functions/stats", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password, days: 7 }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "صار خطأ غير متوقع.");
        const get = (d, key) => key === "visitors" ? d.visitors : (d.counts[key] || 0);
        const sum = (key) => data.days.reduce((s, d) => s + get(d, key), 0);
        const totals = [["visitors", "زوار (مجموع الأيام)"], ["quiz_done", "كمّلوا الاختبار"], ["register_done", "سجّلوا بفعالية"], ["card_share", "شاركوا بطاقة النتيجة"]];
        box.innerHTML =
          '<div class="stats-totals">' + totals.map(([k, l]) => `<div><b>${sum(k)}</b><span>${l}</span></div>`).join("") + "</div>" +
          '<table class="stats-table"><thead><tr><th>اليوم</th>' + STAT_COLS.map(([, l]) => `<th>${l}</th>`).join("") + "</tr></thead><tbody>" +
          data.days.map(d => "<tr><td dir=\"ltr\">" + d.day.slice(5) + "</td>" + STAT_COLS.map(([k]) => `<td>${get(d, k)}</td>`).join("") + "</tr>").join("") +
          "</tbody></table>";
      } catch (err) {
        errBox.className = "result err";
        errBox.textContent = err.message || "تعذر الاتصال بالخادم.";
      }
      statsBtn.disabled = false;
      statsBtn.textContent = "عرض إحصائيات آخر ٧ أيام";
    });
  </script>

</body>
</html>
