<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000878">
  <title>بطاقة العضوية | نادي المحاسبة</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #000878; --cyan: #28beff; --ok: #157a43; --bad: #b42318; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; font-family: "Almarai", system-ui, sans-serif; background: radial-gradient(120% 70% at 50% 0%, #1a2290, #04082e 70%); color: #fff; display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 28px max(16px, env(safe-area-inset-left)) 30px; }
    .card { position: relative; width: min(360px, 100%); aspect-ratio: 875 / 1396; border-radius: 22px; overflow: hidden; background: #0109a2 center / cover no-repeat; box-shadow: 0 24px 60px rgba(0, 0, 0, .5); }
    .card.light { background-color: #4cb4e4; }
    .qr { position: absolute; top: 28%; left: 50%; transform: translateX(-50%); width: 50%; aspect-ratio: 1; }
    .qr canvas, .qr img { width: 100% !important; height: 100% !important; image-rendering: pixelated; }
    /* الخط الأبيض جزء من القالب (عند ٧٦٪ من الطول) */
    .info { position: absolute; inset: 0 10%; text-align: right; }
    .name { position: absolute; inset: auto 0 25.6% 0; font-size: clamp(22px, 7.4vw, 30px); font-weight: 800; line-height: 1.3; }
    .unit, .role { position: absolute; inset-inline: 0; font-size: clamp(13px, 4vw, 16px); font-weight: 700; color: var(--cyan); line-height: 1.5; }
    .unit { top: 79%; } .role { top: 85.5%; }
    .card.light .unit, .card.light .role { color: #0e208c; }
    .badge { display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px; font-weight: 800; font-size: 15px; }
    .badge.on { background: #e3f6ea; color: var(--ok); }
    .badge.off { background: #fdecea; color: var(--bad); }
    .meta { font-size: 13px; opacity: .75; text-align: center; line-height: 1.8; }
    .wallet { display: inline-flex; align-items: center; gap: 10px; background: #000; color: #fff; text-decoration: none; border: 1px solid #555; padding: 12px 22px; border-radius: 14px; font-weight: 800; font-size: 15px; }
    .state { text-align: center; margin-top: 30vh; font-size: 17px; line-height: 1.9; }
    footer { font-size: 12px; opacity: .55; text-align: center; line-height: 1.8; margin-top: auto; }
    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <div class="state" id="state">جاري التحقق من العضوية…</div>

  <div class="card" id="card" hidden>
    <div class="qr" id="qr"></div>
    <div class="info">
      <div class="name" id="name"></div>
      <div class="unit" id="unit"></div>
      <div class="role" id="role"></div>
    </div>
  </div>
  <div class="badge" id="badge" hidden></div>
  <div class="meta" id="meta" hidden></div>
  <a class="wallet" id="wallet" hidden> أضف إلى Apple Wallet</a>

  <footer>Made by Nourah N Aleissa<br>نادي المحاسبة — جامعة الإمام محمد بن سعود الإسلامية</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    (async function () {
      const $ = (id) => document.getElementById(id);
      const token = (location.pathname.split("/m/")[1] || new URLSearchParams(location.search).get("t") || "").replace(/\/$/, "");
      const fail = (msg) => { $("state").textContent = msg; };
      if (!/^\d{3,6}-[a-f0-9]{10}$/.test(token)) return fail("رابط البطاقة غير صحيح.");
      let d;
      try {
        const res = await fetch("/.netlify/functions/members?t=" + encodeURIComponent(token));
        if (res.status === 404) return fail("هذه البطاقة غير صحيحة.");
        d = await res.json();
      } catch (e) { return fail("تعذّر التحقق، تأكد من الإنترنت."); }
      if (!d || d.error) return fail("تعذّر التحقق، حاول مرة ثانية.");

      $("state").hidden = true;
      const badge = $("badge");
      badge.hidden = false;
      if (!d.found) {
        badge.className = "badge off"; badge.textContent = "✕ العضو غير موجود في قائمة الأعضاء الحالية";
        return;
      }
      const card = $("card");
      card.hidden = false;
      card.classList.toggle("light", !d.leader);
      card.style.backgroundImage = `url(/assets/member-${d.leader ? "dark" : "light"}.webp)`;
      $("name").textContent = d.name;
      $("unit").textContent = d.line1 || "نادي المحاسبة";
      $("role").textContent = d.role || "عضو";
      try {
        new QRCode($("qr"), { text: location.origin + "/m/" + token, width: 360, height: 360, colorDark: "#ffffff", colorLight: "rgba(0,0,0,0)", correctLevel: QRCode.CorrectLevel.M });
      } catch (e) { /* */ }
      badge.className = "badge " + (d.active ? "on" : "off");
      badge.textContent = d.active ? "✓ العضوية فعّالة" : "✕ العضوية غير فعّالة";
      $("meta").hidden = false;
      $("meta").textContent = `رقم العضوية ${d.no}` + (d.nameEn ? ` · ${d.nameEn}` : "");
      if (d.wallet && /iPhone|iPad|Macintosh/.test(navigator.userAgent)) {
        $("wallet").href = "/.netlify/functions/members?pass=" + encodeURIComponent(token);
        $("wallet").hidden = false;
      }
      document.title = d.name + " | بطاقة العضوية";
    })();
  </script>
</body>
</html>
